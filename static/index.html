<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuter — YouTube & Shorts indirici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --ink: #17140f;
    --muted: #6f685d;
    --line: #e6e0d6;
    --accent: #ff3d2e;
    --accent-ink: #ffffff;
    --soft: #fff0ec;
    --ok: #12805c;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0e0c;
      --surface: #1a1815;
      --ink: #f3efe8;
      --muted: #9b9387;
      --line: #2c2924;
      --soft: #2a1714;
      --ok: #3ccf98;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Inter Tight", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 48px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums; }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: var(--muted);
    border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px 5px 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s var(--ease) infinite; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800; letter-spacing: -0.035em; line-height: .95;
    font-size: clamp(44px, 10vw, 76px);
    margin: 20px 0 14px;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { color: var(--muted); font-size: 17px; max-width: 46ch; }

  form {
    margin-top: 32px;
    display: flex; gap: 8px; padding: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    transition: border-color .25s, box-shadow .25s;
  }
  form:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 8%, transparent); }
  input[type=url] {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 16px; padding: 0 12px; outline: none;
  }
  input[type=url]::placeholder { color: var(--muted); }
  button {
    font: 600 15px/1 "Inter Tight", sans-serif; cursor: pointer;
    border: 0; border-radius: 12px; padding: 14px 20px;
    background: var(--ink); color: var(--bg);
    transition: transform .2s var(--ease), opacity .2s, background-color .2s;
    display: inline-flex; justify-content: center; align-items: center; gap: 8px;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { border-color: var(--ink); }
  button.busy { position: relative; overflow: hidden; }
  button.busy::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    animation: shimmer 1.2s linear infinite;
  }

  .error { color: var(--accent); font-size: 14px; font-weight: 500; min-height: 22px; margin-top: 10px; }

  .panel {
    margin-top: 12px; padding: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    animation: rise .6s var(--ease) both;
  }
  .panel[hidden] { display: none; }

  /* video kartı */
  .card { display: grid; grid-template-columns: 168px 1fr; gap: 16px; align-items: center; }
  .thumb { position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.short { grid-template-columns: 96px 1fr; }
  .card.short .thumb { aspect-ratio: 9/16; }
  .badge {
    position: absolute; right: 6px; bottom: 6px;
    background: rgba(0,0,0,.75); color: #fff; font-size: 12px; font-weight: 600;
    padding: 2px 6px; border-radius: 6px;
  }
  .meta h2 {
    font: 700 18px/1.25 "Bricolage Grotesque", sans-serif; letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .meta > button { margin-top: 14px; width: 100%; }
  .ready { color: var(--ok); font-weight: 600; font-size: 14px; margin-top: 14px; display: flex; align-items: center; gap: 6px; }
  .ready svg { animation: pop .5s var(--ease) both; }

  .skeleton .thumb, .skeleton .bar { background: var(--line); animation: fade 1.2s ease-in-out infinite alternate; }
  .bar { height: 14px; border-radius: 6px; margin-bottom: 8px; }

  /* biçim seçici */
  .seg {
    display: inline-grid; grid-template-columns: 1fr 1fr; position: relative;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px;
  }
  .seg button { background: transparent; color: var(--muted); padding: 9px 18px; border-radius: 9px; position: relative; z-index: 1; }
  .seg button[aria-pressed=true] { color: var(--ink); }
  .seg .pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
    background: var(--surface); border-radius: 9px; box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transition: transform .35s var(--ease);
  }
  .seg[data-v=mp3] .pill { transform: translateX(100%); }

  /* iki seçenek */
  .choices-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .choices-head h3 { font: 700 17px/1.2 "Bricolage Grotesque", sans-serif; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
    padding: 18px; border-radius: 14px; line-height: 1.3;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    transition: transform .25s var(--ease), border-color .2s, background-color .2s;
  }
  .choice:hover { border-color: var(--ink); transform: translateY(-2px); }
  .choice:active { transform: scale(.97); }
  .choice b { font: 700 17px/1.2 "Bricolage Grotesque", sans-serif; }
  .choice small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .choice .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft); color: var(--accent); margin-bottom: 4px; }
  .choice.on { border-color: var(--accent); background: var(--soft); }

  /* kırpma editörü */
  video { width: 100%; max-height: 52vh; border-radius: 12px; background: #000; display: block; }
  .timeline { position: relative; height: 44px; margin: 18px 4px 6px; }
  .track { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 99px; background: var(--line); }
  .sel { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
  .head { position: absolute; top: 12px; width: 2px; height: 20px; background: var(--ink); border-radius: 2px; pointer-events: none; transform: translateX(-1px); }
  .timeline input[type=range] {
    position: absolute; inset: 0; width: 100%; height: 44px; margin: 0;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
  }
  .timeline input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; cursor: grab;
    width: 18px; height: 30px; border-radius: 6px; background: var(--surface);
    border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .timeline input[type=range]::-moz-range-thumb {
    pointer-events: auto; cursor: grab;
    width: 14px; height: 26px; border-radius: 6px; background: var(--surface);
    border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .timeline input[type=range]::-moz-range-track { background: none; }
  .timeline input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ink); outline-offset: 2px; }
  .times { display: flex; justify-content: space-between; color: var(--muted); }
  .times strong { color: var(--ink); font-weight: 500; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .tools button { flex: 1; min-width: 96px; padding: 12px 10px; font-size: 14px; }
  .export { margin-top: 10px; width: 100%; }

  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }

  /* giriş animasyonu */
  .in { animation: rise .8s var(--ease) both; }
  .in:nth-child(2) { animation-delay: .07s; }
  .in:nth-child(3) { animation-delay: .14s; }
  .in:nth-child(4) { animation-delay: .21s; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @keyframes fade { from { opacity: .5; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); } to { transform: none; } }

  @media (max-width: 520px) {
    form { flex-direction: column; }
    input[type=url] { padding: 12px; }
    .card { grid-template-columns: 1fr; }
    .card.short { grid-template-columns: 96px 1fr; }
    .choices { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <span class="tag in"><span class="dot"></span>Cuter · YouTube &amp; Shorts</span>
  <h1 class="in">Bağlantıyı yapıştır,<br><em>indir.</em></h1>
  <p class="lead in">Video ya da Shorts bağlantısını gir. Tamamını veya istediğin kısmı MP4 / MP3 olarak kaydet.</p>

  <form id="form" class="in" autocomplete="off">
    <input id="url" type="url" inputmode="url" placeholder="https://youtube.com/shorts/…" required aria-label="YouTube bağlantısı">
    <button id="go" type="submit">Getir</button>
  </form>
  <div class="error" id="error" role="alert"></div>

  <!-- 1. video kartı -->
  <section class="panel card" id="card" hidden aria-live="polite"></section>

  <!-- 2. iki seçenek -->
  <section class="panel" id="choices" hidden>
    <div class="choices-head">
      <h3>Nasıl indirmek istersin?</h3>
      <div class="seg" id="seg" data-v="mp4" role="group" aria-label="Biçim">
        <span class="pill"></span>
        <button type="button" data-v="mp4" aria-pressed="true">MP4</button>
        <button type="button" data-v="mp3" aria-pressed="false">MP3</button>
      </div>
    </div>
    <div class="choices">
      <button type="button" class="choice" id="full">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg></span>
        <b>Hepsini indir</b>
        <small id="full-sub">Videonun tamamı</small>
      </button>
      <button type="button" class="choice" id="trim">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></span>
        <b>Kırp ve indir</b>
        <small>Belirli bir bölümü seç</small>
      </button>
    </div>
  </section>

  <!-- 3. kırpma editörü -->
  <section class="panel" id="editor" hidden>
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="timeline" id="timeline">
      <div class="track"><div class="sel" id="sel"></div></div>
      <div class="head" id="head"></div>
      <input type="range" id="r-start" min="0" step="0.1" value="0" aria-label="Başlangıç">
      <input type="range" id="r-end" min="0" step="0.1" value="0" aria-label="Bitiş">
    </div>
    <div class="times mono">
      <span>Başlangıç <strong id="t-start">0:00.0</strong></span>
      <span>Süre <strong id="t-len">0:00.0</strong></span>
      <span>Bitiş <strong id="t-end">0:00.0</strong></span>
    </div>
    <div class="tools">
      <button type="button" class="btn-ghost" id="set-start">[ Başlangıç = şu an</button>
      <button type="button" class="btn-ghost" id="play-sel">▶ Seçimi oynat</button>
      <button type="button" class="btn-ghost" id="set-end">Bitiş = şu an ]</button>
    </div>
    <button type="button" class="btn-accent export" id="export">Kırpılmış halini indir</button>
  </section>

  <footer>Yalnızca hakkına sahip olduğun ya da indirme izni verilen içerikler için kullan.</footer>
</main>

<script>
const $ = (s) => document.querySelector(s);
const form = $("#form"), input = $("#url"), go = $("#go"), err = $("#error");
const card = $("#card"), choices = $("#choices"), editor = $("#editor");
const seg = $("#seg"), video = $("#video");
const rStart = $("#r-start"), rEnd = $("#r-end");

const state = { url: null, job: null, title: "", duration: 0, format: "mp4" };

const fmtTime = (s, tenths = false) => {
  if (s == null || isNaN(s)) return "";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  const sec = tenths ? (s % 60).toFixed(1).padStart(4, "0") : String(Math.floor(s % 60)).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
};
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const replay = (el) => { el.style.animation = "none"; el.offsetHeight; el.style.animation = ""; };
const show = (el) => { el.hidden = false; replay(el); };

function resetBelow() {
  choices.hidden = editor.hidden = true;
  $("#trim").classList.remove("on");
  video.removeAttribute("src"); video.load();
  state.job = null;
}

/* ---------- 1. bilgi getir ---------- */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  go.disabled = true;
  resetBelow();
  card.className = "panel card skeleton";
  card.innerHTML = `<div class="thumb"></div><div><div class="bar" style="width:85%"></div><div class="bar" style="width:40%"></div></div>`;
  show(card);
  try {
    const res = await fetch("/api/info?url=" + encodeURIComponent(input.value));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    Object.assign(state, { url: input.value, title: data.title, duration: data.duration || 0 });
    card.className = "panel card" + (data.is_short ? " short" : "");
    card.innerHTML = `
      <div class="thumb">${data.thumbnail ? `<img src="${esc(data.thumbnail)}" alt="" onerror="this.remove()">` : ""}${data.duration ? `<span class="badge">${fmtTime(data.duration)}</span>` : ""}</div>
      <div class="meta">
        <h2>${esc(data.title)}</h2>
        <p>${esc(data.channel)}${data.is_short ? " · Shorts" : ""}</p>
        <button type="button" class="btn-accent" id="prepare">Videoyu hazırla</button>
      </div>`;
    replay(card);
  } catch (e2) {
    card.hidden = true;
    err.textContent = e2.message || "Bir şeyler ters gitti.";
  } finally {
    go.disabled = false;
  }
});

/* ---------- 2. sunucuda hazırla ---------- */
card.addEventListener("click", async (e) => {
  const btn = e.target.closest("#prepare");
  if (!btn) return;
  btn.disabled = true; btn.classList.add("busy"); btn.textContent = "Hazırlanıyor…";
  err.textContent = "";
  try {
    const res = await fetch("/api/prepare", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: state.url }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    state.job = data.id;
    if (data.duration) state.duration = data.duration;
    btn.outerHTML = `<div class="ready"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Hazır</div>`;
    $("#full-sub").textContent = state.duration ? `Videonun tamamı · ${fmtTime(state.duration)}` : "Videonun tamamı";
    show(choices);
  } catch (e2) {
    err.textContent = e2.message || "Hazırlanamadı.";
    btn.disabled = false; btn.classList.remove("busy"); btn.textContent = "Tekrar dene";
  }
});

/* biçim seçici */
seg.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  state.format = seg.dataset.v = b.dataset.v;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  $("#export").textContent = `Kırpılmış halini indir (${state.format.toUpperCase()})`;
});

/* ---------- indirme yardımcısı ---------- */
async function download(btn, params) {
  const label = btn.innerHTML;
  btn.disabled = true; btn.classList.add("busy");
  err.textContent = "";
  try {
    const q = new URLSearchParams({ format: state.format, ...params });
    const res = await fetch(`/api/export/${state.job}?${q}`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "İndirme başarısız.");
    const cd = res.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename\*=UTF-8''([^;]+)/i) || cd.match(/filename="?([^";]+)"?/i);
    const name = m ? decodeURIComponent(m[1]) : `video.${state.format}`;
    const blob = await res.blob();
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e2) {
    err.textContent = e2.message;
  } finally {
    btn.disabled = false; btn.classList.remove("busy"); btn.innerHTML = label;
  }
}

/* 1. seçenek: hepsini indir */
$("#full").addEventListener("click", (e) => download(e.currentTarget, {}));

/* 2. seçenek: kırpma editörünü aç */
$("#trim").addEventListener("click", (e) => {
  e.currentTarget.classList.add("on");
  if (!editor.hidden) return;
  video.src = `/api/media/${state.job}`;
  setRange(state.duration);
  show(editor);
  editor.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
});

/* ---------- kırpma editörü ---------- */
const MIN_LEN = 0.5;
function setRange(dur) {
  if (!dur) return;
  state.duration = dur;
  rStart.max = rEnd.max = dur;
  rStart.value = 0; rEnd.value = dur;
  paint();
}
video.addEventListener("loadedmetadata", () => {
  if (isFinite(video.duration) && Math.abs(video.duration - state.duration) > 0.2) setRange(video.duration);
});

function paint() {
  const d = state.duration || 1, s = +rStart.value, en = +rEnd.value;
  const sel = $("#sel");
  sel.style.left = (s / d * 100) + "%";
  sel.style.width = ((en - s) / d * 100) + "%";
  $("#t-start").textContent = fmtTime(s, true);
  $("#t-end").textContent = fmtTime(en, true);
  $("#t-len").textContent = fmtTime(en - s, true);
}

rStart.addEventListener("input", () => {
  if (+rStart.value > +rEnd.value - MIN_LEN) rStart.value = +rEnd.value - MIN_LEN;
  video.currentTime = +rStart.value; paint();
});
rEnd.addEventListener("input", () => {
  if (+rEnd.value < +rStart.value + MIN_LEN) rEnd.value = +rStart.value + MIN_LEN;
  video.currentTime = +rEnd.value; paint();
});
// tutamaklar üst üste geldiğinde tıklanan tarafın üstte olması için
$("#timeline").addEventListener("pointerdown", (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const t = (e.clientX - rect.left) / rect.width * state.duration;
  const nearStart = Math.abs(t - rStart.value) <= Math.abs(t - rEnd.value);
  rStart.style.zIndex = nearStart ? 2 : 1;
  rEnd.style.zIndex = nearStart ? 1 : 2;
});

$("#set-start").addEventListener("click", () => {
  rStart.value = Math.min(video.currentTime, +rEnd.value - MIN_LEN); paint();
});
$("#set-end").addEventListener("click", () => {
  rEnd.value = Math.max(video.currentTime, +rStart.value + MIN_LEN); paint();
});

let previewing = false;
$("#play-sel").addEventListener("click", () => {
  video.currentTime = +rStart.value;
  previewing = true;
  video.play();
});
video.addEventListener("timeupdate", () => {
  $("#head").style.left = (video.currentTime / (state.duration || 1) * 100) + "%";
  if (previewing && video.currentTime >= +rEnd.value) { video.pause(); previewing = false; }
});
video.addEventListener("pause", () => (previewing = false));

$("#export").addEventListener("click", (e) =>
  download(e.currentTarget, { start: (+rStart.value).toFixed(2), end: (+rEnd.value).toFixed(2) })
);
$("#export").textContent = "Kırpılmış halini indir (MP4)";
</script>
</body>
</html>
